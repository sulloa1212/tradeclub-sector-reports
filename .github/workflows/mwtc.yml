name: Build MWTC report (Pre-Market / Market Wrap)

# The MWTC Daily AI Report bot (code under mwtc/). Pulls live market data
# (Unusual Whales REST + free macro/sentiment), asks Claude to write the report,
# and publishes it into the reports hub: premarket -> site/pre-market/,
# postmarket -> site/market-wrap/. Trigger from cron-job.org:
#   {"ref":"main","inputs":{"mode":"premarket","force":false}}   (8:40 AM ET / 6:40 AM CR)
#   {"ref":"main","inputs":{"mode":"postmarket","force":false}}  (4:30 PM ET / 2:30 PM CR)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket / postmarket — or check-keys to test the API keys (no report, no cost)"
        type: choice
        options: [premarket, postmarket, check-keys]
        default: premarket
      force:
        description: "Run even if the market is closed today or the report already exists"
        type: boolean
        default: false
      preview:
        description: "PREVIEW: build into mwtc_out/ (artifact only) — nothing published, committed or notified. Required on any branch but main."
        type: boolean
        default: false

permissions:
  contents: write   # commit the published report back

concurrency:
  group: build-mwtc-${{ github.event.inputs.mode }}${{ inputs.preview && '-preview' || '' }}
  cancel-in-progress: false

jobs:
  mwtc:
    runs-on: ubuntu-latest
    # A hung build must fail, not sit for GitHub's 6-hour default.
    timeout-minutes: 60
    env:
      MODE_IN: ${{ inputs.mode }}
      FORCE_IN: ${{ inputs.force }}
      PREVIEW_IN: ${{ inputs.preview }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r mwtc/requirements.txt

      - name: Guard (skip closed market days / already-built today)
        id: guard
        run: |
          MODE="${MODE_IN:-premarket}"
          # Only main may publish. A report run on any other ref must be a
          # preview; check-keys is a $0 probe and may run anywhere.
          if [ "$MODE" != "check-keys" ] && [ "$GITHUB_REF_NAME" != "main" ] && [ "$PREVIEW_IN" != "true" ]; then
            echo "::error::Ref '$GITHUB_REF_NAME' is not main — re-run with preview=true (a preview publishes nothing)."
            exit 1
          fi
          # A preview skips the market-day/already-built checks and every
          # publishing step (they all require go=true).
          if [ "$PREVIEW_IN" = "true" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$MODE" = "check-keys" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          SLUG=pre-market; [ "$MODE" = "postmarket" ] && SLUG=market-wrap
          if [ "$FORCE_IN" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Exit 0 = open, 3 = closed. ANY other code is a CRASH, not a holiday.
          # 2026-09-28: a bad pip resolution broke `import build`; the old
          # `if ! python ...` read the traceback as "market closed", skipped
          # the build and reported success — the Pre-Market report vanished
          # with no red X and no alert. A crash now fails the run loudly
          # unless it is plainly a weekend.
          set +e
          python -c "import build,sys; sys.exit(0 if build.market_open_today() else 3)"
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "US market closed today — skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          elif [ "$rc" != "0" ]; then
            if [ "$(TZ=America/New_York date +%u)" -ge 6 ]; then
              echo "Market-calendar check crashed (exit $rc) on a weekend — skipping."
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Market-calendar check CRASHED (exit $rc) on a weekday — this is NOT a closed market. Failing the run so it is visible."
            exit 1
          fi
          # ET, matching mwtc/publish.py's file-date clock — a market-wrap retry
          # after 8 PM ET crosses UTC midnight and would claim tomorrow's slot
          # (same failure as the 2026-08-27 gap-risk incident).
          TODAY=$(TZ=America/New_York date +%F)
          if [ -f "site/$SLUG/$TODAY.html" ]; then
            echo "$SLUG already built for $TODAY — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Check API keys (no report, no token cost)
        if: inputs.mode == 'check-keys'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CME_FEDWATCH_API_ID: ${{ secrets.CME_FEDWATCH_API_ID }}
          CME_FEDWATCH_API_SECRET: ${{ secrets.CME_FEDWATCH_API_SECRET }}
          # Optional — Kalshi Fed odds are PUBLIC (no key needed); these only
          # matter if authenticated/portfolio calls are added later.
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          python -m mwtc.main --check-keys
          # Live packet probe: collect real data and run the size governor, with
          # no model call and nothing published ($0). Use it to check a change
          # to the collectors against real payloads before a scheduled run.
          python -m mwtc.publish --mode premarket --dry-run

      - name: Build & publish the report (live data + Anthropic)
        if: steps.guard.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CME_FEDWATCH_API_ID: ${{ secrets.CME_FEDWATCH_API_ID }}
          CME_FEDWATCH_API_SECRET: ${{ secrets.CME_FEDWATCH_API_SECRET }}
          # Optional — Kalshi Fed odds are PUBLIC (no key needed); these only
          # matter if authenticated/portfolio calls are added later.
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          # Telegram notification — same secret/vars as the other reports.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python -m mwtc.publish --mode "${MODE_IN:-premarket}"
          python build.py --rebuild-hub

      - name: Build a PREVIEW (no publish, no notification)
        if: inputs.preview == true && inputs.mode != 'check-keys'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CME_FEDWATCH_API_ID: ${{ secrets.CME_FEDWATCH_API_ID }}
          CME_FEDWATCH_API_SECRET: ${{ secrets.CME_FEDWATCH_API_SECRET }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python -m mwtc.publish --mode "${MODE_IN:-premarket}" --preview

      # Earnings + movers trace (and the preview page). The repo is public, so
      # this artifact is too: mwtc/publish.py keeps paid-feed data out of it.
      - name: Keep this run's trace (artifact, 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwtc-${{ inputs.mode }}-packet
          path: mwtc_out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit & push the rebuilt site (race-safe)
        if: steps.guard.outputs.go == 'true' && inputs.preview != true
        run: |
          if [ "$PREVIEW_IN" = "true" ] || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::refusing to publish (preview=$PREVIEW_IN, ref=$GITHUB_REF_NAME)"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/
          git commit -m "MWTC: ${MODE_IN} $(date -u +%Y-%m-%d)" || { echo "Nothing to commit"; exit 0; }
          for i in $(seq 1 10); do
            if git push origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected — syncing & retrying ($i)…"
            git fetch origin main || { sleep $((i % 5 + 1)); continue; }
            git merge -X theirs --no-edit FETCH_HEAD || true
            python build.py --rebuild-hub || true
            git add site/index.html
            git commit --no-edit -m "Rebuild hub after concurrent merge" || true
            sleep $((i % 5 + 1))
          done
          echo "ERROR: could not push after retries"; exit 1

      # ---- Dead-man's switch de MWTC Health -------------------------------
      # Condicionado a `steps.guard.outputs.go`, no solo a success(): el guard
      # sale con 0 en días de mercado cerrado y cuando el informe ya existe,
      # así que un job exitoso NO significa que se haya publicado algo. Sin
      # esta condición el check quedaría verde para siempre con una lista de
      # feriados equivocada.
      #
      # La clave sale del modo: tradeclub-premarket / tradeclub-postmarket.
      # Son corridas independientes y fallan por separado.
      - name: Check in to MWTC Health
        if: success() && steps.guard.outputs.go == 'true' && inputs.mode != 'check-keys' && inputs.preview != true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.HEALTH_CHECKIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"run\":\"${{ github.run_id }}\",\"mode\":\"${{ inputs.mode }}\"}" \
            https://mwtc-health.green-paper-667a.workers.dev/checkin/tradeclub-${{ inputs.mode }}
          echo "Checked in as tradeclub-${{ inputs.mode }}."
